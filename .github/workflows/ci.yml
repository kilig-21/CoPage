name: CoPage checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: copage-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Docker source build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build default Dockerfile from source
        run: docker build -f backend/Dockerfile -t copage-backend:ci backend
      - name: Check runtime user and JAR
        run: |
          test "$(docker image inspect copage-backend:ci --format '{{.Config.User}}')" = app
          docker run --rm --network none --entrypoint sh copage-backend:ci -ec 'test "$(id -un)" = app; test -r /app/app.jar'
  backend:
    name: Java tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: copage-ci-only-109
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and build executable JAR
        env:
          COPAGE_MIGRATION_TEST_MYSQL: 127.0.0.1:${{ job.services.mysql.ports[3306] }}
          COPAGE_MIGRATION_TEST_PASSWORD: copage-ci-only-109
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify

  frontend:
    name: Frontend tests, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Run frontend regression
        run: npm test
      - name: Verify recovery channel diagnostics
        working-directory: .
        run: node --test scripts/recovery-channel.test.mjs scripts/smoke-join.test.mjs
      - name: Check dependency advisories
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate
      - name: Build production frontend
        run: npm run build
      - name: Check initial JavaScript bundles
        run: node scripts/check-initial-bundles.mjs

  browser:
    name: Chromium end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser scenarios against isolated Compose
        working-directory: frontend
        run: npm run test:e2e
      - name: Redact fixture credentials from failed traces
        id: redact
        if: failure()
        run: python3 scripts/redact-browser-traces.py frontend/test-results/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() && steps.redact.outcome == 'success' }}
        with:
          name: copage-browser-smoke-failure
          path: frontend/test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
