# 独立配置，不能与 docker-compose.yml 合并使用。
name: copage-production

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    mem_limit: ${COPAGE_BACKEND_MEM_LIMIT:-896m}
    cpus: ${COPAGE_BACKEND_CPUS:-1.0}
    logging: *service-logging
    build: ./backend
    image: copage-backend:production
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "7", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 3
    environment:
      JAVA_TOOL_OPTIONS: "${COPAGE_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0}"
      SPRING_PROFILES_ACTIVE: prod
      COPAGE_CONFIG_MODE: private-compose
      MYSQL_URL: jdbc:mysql://mysql:3306/collab_doc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
      MYSQL_USER: copage
      MYSQL_PASSWORD: ${PROD_MYSQL_PASSWORD:?设置独立的应用数据库密码}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD:?设置 Redis 密码}
      DOCUMENT_CACHE_TTL_SECONDS: ${DOCUMENT_CACHE_TTL_SECONDS:-3600}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: copage
      RABBITMQ_PASSWORD: ${PROD_RABBITMQ_PASSWORD:?设置 RabbitMQ 密码}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEARCH_REPAIR_INTERVAL_MS: ${SEARCH_REPAIR_INTERVAL_MS:-5000}
      MINIO_ENDPOINT: http://minio:9000
      IMAGE_UPLOAD_COUNT_LIMIT: ${IMAGE_UPLOAD_COUNT_LIMIT:-1000}
      IMAGE_UPLOAD_BYTE_LIMIT: ${IMAGE_UPLOAD_BYTE_LIMIT:-268435456}
      MINIO_PUBLIC_ENDPOINT: ${PROD_MINIO_PUBLIC_ENDPOINT:?设置图片服务的 HTTPS 地址}
      MINIO_ACCESS_KEY: ${PROD_MINIO_ROOT_USER:?设置 MinIO 账号}
      MINIO_SECRET_KEY: ${PROD_MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
      MINIO_BUCKET: collab
      JWT_SECRET: ${PROD_JWT_SECRET:?设置至少 32 字节的独立 JWT 密钥}
      FRONTEND_ORIGIN: ${PROD_FRONTEND_ORIGIN:?设置前端精确 HTTPS origin}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-300}
      AUTH_LOGIN_ACCOUNT_IP_LIMIT: ${AUTH_LOGIN_ACCOUNT_IP_LIMIT:-30}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-60}
      AUTH_REGISTER_IP_LIMIT: ${AUTH_REGISTER_IP_LIMIT:-60}
      AUTH_REGISTER_ACCOUNT_IP_LIMIT: ${AUTH_REGISTER_ACCOUNT_IP_LIMIT:-5}
      AUTH_REGISTER_WINDOW_SECONDS: ${AUTH_REGISTER_WINDOW_SECONDS:-600}
      AUTH_FAILURE_ATTEMPTS: ${AUTH_FAILURE_ATTEMPTS:-5}
      AUTH_FAILURE_WINDOW_SECONDS: ${AUTH_FAILURE_WINDOW_SECONDS:-120}
      AUTH_LOCK_SECONDS: ${AUTH_LOCK_SECONDS:-60}
      AUTH_LIMIT_TRUSTED_PROXIES: ${AUTH_LIMIT_TRUSTED_PROXIES:-}
      HISTORY_RETENTION_ENABLED: ${HISTORY_RETENTION_ENABLED:-true}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      HISTORY_MAX_OPERATIONS: ${HISTORY_MAX_OPERATIONS:-10000}
      HISTORY_MAX_SNAPSHOTS: ${HISTORY_MAX_SNAPSHOTS:-100}
      HISTORY_MAX_BYTES: ${HISTORY_MAX_BYTES:-67108864}
      HISTORY_PROTECTED_DOC_IDS: ${HISTORY_PROTECTED_DOC_IDS:-26,536,548}
    ports:
      - "127.0.0.1:${PROD_BACKEND_PORT:-18080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mysql:
    mem_limit: ${COPAGE_MYSQL_MEM_LIMIT:-768m}
    cpus: ${COPAGE_MYSQL_CPUS:-1.0}
    logging: *service-logging
    image: mysql:8.4.3
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: collab_doc
      MYSQL_USER: copage
      MYSQL_PASSWORD: ${PROD_MYSQL_PASSWORD:?设置独立的应用数据库密码}
      MYSQL_ROOT_PASSWORD: ${PROD_MYSQL_ROOT_PASSWORD:?设置独立的数据库 root 密码}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration/V1__baseline.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    mem_limit: ${COPAGE_REDIS_MEM_LIMIT:-256m}
    cpus: ${COPAGE_REDIS_CPUS:-0.5}
    logging: *service-logging
    image: redis:7.4.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD:?设置 Redis 密码}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PROD_REDIS_PASSWORD:?设置 Redis 密码}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    mem_limit: ${COPAGE_RABBITMQ_MEM_LIMIT:-512m}
    cpus: ${COPAGE_RABBITMQ_CPUS:-0.75}
    logging: *service-logging
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: copage
      RABBITMQ_DEFAULT_PASS: ${PROD_RABBITMQ_PASSWORD:?设置 RabbitMQ 密码}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    mem_limit: ${COPAGE_ES_MEM_LIMIT:-1024m}
    cpus: ${COPAGE_ES_CPUS:-1.5}
    logging: *service-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms${COPAGE_ES_HEAP:-512m} -Xmx${COPAGE_ES_HEAP:-512m}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    mem_limit: ${COPAGE_MINIO_MEM_LIMIT:-512m}
    cpus: ${COPAGE_MINIO_CPUS:-0.5}
    logging: *service-logging
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${PROD_MINIO_ROOT_USER:?设置 MinIO 账号}
      MINIO_ROOT_PASSWORD: ${PROD_MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${PROD_MINIO_PORT:-19000}:9000"
    volumes:
      - minio-data:/data

  minio-init:
    mem_limit: ${COPAGE_MINIO_INIT_MEM_LIMIT:-128m}
    cpus: ${COPAGE_MINIO_INIT_CPUS:-0.25}
    logging: *service-logging
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${PROD_MINIO_ROOT_USER:?设置 MinIO 账号}
      MINIO_ROOT_PASSWORD: ${PROD_MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set collab http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing collab/collab
        mc anonymous set none collab/collab

# 每个 Compose 项目有独立网络及数据卷；本配置没有共享开发项目的卷名。
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  minio-data:
