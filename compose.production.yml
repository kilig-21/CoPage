# 独立配置，不能与 docker-compose.yml 合并使用。
name: copage-production

services:
  backend:
    build: ./backend
    image: copage-backend:production
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/collab_doc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_USER: copage
      MYSQL_PASSWORD: ${PROD_MYSQL_PASSWORD:?设置独立的应用数据库密码}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD:?设置 Redis 密码}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: copage
      RABBITMQ_PASSWORD: ${PROD_RABBITMQ_PASSWORD:?设置 RabbitMQ 密码}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${PROD_MINIO_PUBLIC_ENDPOINT:?设置图片服务的 HTTPS 地址}
      MINIO_ACCESS_KEY: ${PROD_MINIO_ROOT_USER:?设置 MinIO 账号}
      MINIO_SECRET_KEY: ${PROD_MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
      MINIO_BUCKET: collab
      JWT_SECRET: ${PROD_JWT_SECRET:?设置至少 32 字节的独立 JWT 密钥}
      FRONTEND_ORIGIN: ${PROD_FRONTEND_ORIGIN:?设置前端精确 HTTPS origin}
    ports:
      - "127.0.0.1:${PROD_BACKEND_PORT:-18080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4.3
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: collab_doc
      MYSQL_USER: copage
      MYSQL_PASSWORD: ${PROD_MYSQL_PASSWORD:?设置独立的应用数据库密码}
      MYSQL_ROOT_PASSWORD: ${PROD_MYSQL_ROOT_PASSWORD:?设置独立的数据库 root 密码}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD:?设置 Redis 密码}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PROD_REDIS_PASSWORD:?设置 Redis 密码}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: copage
      RABBITMQ_DEFAULT_PASS: ${PROD_RABBITMQ_PASSWORD:?设置 RabbitMQ 密码}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${PROD_MINIO_ROOT_USER:?设置 MinIO 账号}
      MINIO_ROOT_PASSWORD: ${PROD_MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${PROD_MINIO_PORT:-19000}:9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${PROD_MINIO_ROOT_USER:?设置 MinIO 账号}
      MINIO_ROOT_PASSWORD: ${PROD_MINIO_ROOT_PASSWORD:?设置 MinIO 密码}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set collab http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing collab/collab
        mc anonymous set download collab/collab

# 每个 Compose 项目有独立网络及数据卷；本配置没有共享开发项目的卷名。
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  minio-data:
