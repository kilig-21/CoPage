name: collab-docs

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    mem_limit: ${COPAGE_BACKEND_MEM_LIMIT:-896m}
    cpus: ${COPAGE_BACKEND_CPUS:-1.0}
    logging: *service-logging
    profiles: [app]
    build: ./backend
    container_name: collab-backend
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "7", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 8s
      start_period: 30s
      retries: 3
    environment:
      JAVA_TOOL_OPTIONS: "${COPAGE_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0}"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      COPAGE_CONFIG_MODE: local
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-collab_doc}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOCUMENT_CACHE_TTL_SECONDS: ${DOCUMENT_CACHE_TTL_SECONDS:-3600}
      FRONTEND_ERROR_REPORTING_ENABLED: ${FRONTEND_ERROR_REPORTING_ENABLED:-false}
      FRONTEND_ERROR_REPORT_LIMIT_PER_MINUTE: ${FRONTEND_ERROR_REPORT_LIMIT_PER_MINUTE:-60}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-collab}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-123456}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEARCH_REPAIR_INTERVAL_MS: ${SEARCH_REPAIR_INTERVAL_MS:-5000}
      MINIO_ENDPOINT: http://minio:9000
      IMAGE_UPLOAD_COUNT_LIMIT: ${IMAGE_UPLOAD_COUNT_LIMIT:-1000}
      IMAGE_UPLOAD_BYTE_LIMIT: ${IMAGE_UPLOAD_BYTE_LIMIT:-268435456}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: collab
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-300}
      AUTH_LOGIN_ACCOUNT_IP_LIMIT: ${AUTH_LOGIN_ACCOUNT_IP_LIMIT:-30}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-60}
      AUTH_REGISTER_IP_LIMIT: ${AUTH_REGISTER_IP_LIMIT:-60}
      AUTH_REGISTER_ACCOUNT_IP_LIMIT: ${AUTH_REGISTER_ACCOUNT_IP_LIMIT:-5}
      AUTH_REGISTER_WINDOW_SECONDS: ${AUTH_REGISTER_WINDOW_SECONDS:-600}
      AUTH_FAILURE_ATTEMPTS: ${AUTH_FAILURE_ATTEMPTS:-5}
      AUTH_FAILURE_WINDOW_SECONDS: ${AUTH_FAILURE_WINDOW_SECONDS:-120}
      AUTH_LOCK_SECONDS: ${AUTH_LOCK_SECONDS:-60}
      AUTH_LIMIT_TRUSTED_PROXIES: ${AUTH_LIMIT_TRUSTED_PROXIES:-}
      HISTORY_RETENTION_ENABLED: ${HISTORY_RETENTION_ENABLED:-true}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      HISTORY_MAX_OPERATIONS: ${HISTORY_MAX_OPERATIONS:-10000}
      HISTORY_MAX_SNAPSHOTS: ${HISTORY_MAX_SNAPSHOTS:-100}
      HISTORY_MAX_BYTES: ${HISTORY_MAX_BYTES:-67108864}
      HISTORY_PROTECTED_DOC_IDS: ${HISTORY_PROTECTED_DOC_IDS:-26,536,548}
    ports:
      # 可选容器实例与 IDEA 的 8080/8081 并存；本地检查用 8082。
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mysql:
    mem_limit: ${COPAGE_MYSQL_MEM_LIMIT:-768m}
    cpus: ${COPAGE_MYSQL_CPUS:-1.0}
    logging: *service-logging
    image: mysql:8.4.3
    container_name: collab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-collab_doc}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      # 本机 3307 已被另一个项目（ai-commerce）占用，这里改用 3308。
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration/V1__baseline.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/demo-users.sql:/docker-entrypoint-initdb.d/02-demo-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    mem_limit: ${COPAGE_REDIS_MEM_LIMIT:-256m}
    cpus: ${COPAGE_REDIS_CPUS:-0.5}
    logging: *service-logging
    image: redis:7.4.1-alpine
    container_name: collab-redis
    restart: unless-stopped
    ports:
      # 本机 6379 已被 ai-commerce-redis 占用，这里改用 6380。
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    mem_limit: ${COPAGE_RABBITMQ_MEM_LIMIT:-512m}
    cpus: ${COPAGE_RABBITMQ_CPUS:-0.75}
    logging: *service-logging
    image: rabbitmq:3.13.7-management
    container_name: collab-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-collab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-123456}
    ports:
      # 本机 5672 / 15672 已被 ai-commerce-rabbitmq 占用，这里改用 5673 / 15673。
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    mem_limit: ${COPAGE_ES_MEM_LIMIT:-1024m}
    cpus: ${COPAGE_ES_CPUS:-1.5}
    logging: *service-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: collab-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms${COPAGE_ES_HEAP:-512m} -Xmx${COPAGE_ES_HEAP:-512m}
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    mem_limit: ${COPAGE_MINIO_MEM_LIMIT:-512m}
    cpus: ${COPAGE_MINIO_CPUS:-0.5}
    logging: *service-logging
    # MinIO 已从 Docker Hub 撤下官方镜像（拉取会报 pull access denied），改用官方 registry quay.io。
    # 如 quay.io 拉取慢，可替换为：docker.m.daocloud.io/minio/minio:latest
    image: quay.io/minio/minio:latest
    container_name: collab-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    mem_limit: ${COPAGE_MINIO_INIT_MEM_LIMIT:-128m}
    cpus: ${COPAGE_MINIO_INIT_CPUS:-0.25}
    logging: *service-logging
    image: quay.io/minio/mc:latest
    container_name: collab-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # 注意：这里必须写成「只有一个元素的 YAML 列表」。
    # 写成折叠标量（>-）时，Compose 会把整段命令按空格拆成 argv 列表，
    # entrypoint 的 -c 就只拿到 "until" 一个词，报 `syntax error: unexpected end of file`。
    # 单元素列表保证 /bin/sh -c 收到的是完整的一段脚本。
    command:
      - |
        until mc alias set collab http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "等待 MinIO 就绪..."
          sleep 2
        done
        mc mb --ignore-existing collab/collab
        mc anonymous set none collab/collab || { echo "图片存储初始化失败：无法设置 collab 桶的读取权限。" >&2; exit 1; }
        echo "MinIO 初始化完成：bucket=collab（私有）"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  minio-data:
