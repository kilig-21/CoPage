name: collab-docs

services:
  mysql:
    image: mysql:8.4.3
    container_name: collab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-collab_doc}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      # 本机 3307 已被另一个项目（ai-commerce）占用，这里改用 3308。
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1-alpine
    container_name: collab-redis
    restart: unless-stopped
    ports:
      # 本机 6379 已被 ai-commerce-redis 占用，这里改用 6380。
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: collab-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-collab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-123456}
    ports:
      # 本机 5672 / 15672 已被 ai-commerce-rabbitmq 占用，这里改用 5673 / 15673。
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: collab-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    # MinIO 已从 Docker Hub 撤下官方镜像（拉取会报 pull access denied），改用官方 registry quay.io。
    # 如 quay.io 拉取慢，可替换为：docker.m.daocloud.io/minio/minio:latest
    image: quay.io/minio/minio:latest
    container_name: collab-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: collab-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # 注意：这里必须写成「只有一个元素的 YAML 列表」。
    # 写成折叠标量（>-）时，Compose 会把整段命令按空格拆成 argv 列表，
    # entrypoint 的 -c 就只拿到 "until" 一个词，报 `syntax error: unexpected end of file`。
    # 单元素列表保证 /bin/sh -c 收到的是完整的一段脚本。
    command:
      - |
        until mc alias set collab http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "等待 MinIO 就绪..."
          sleep 2
        done
        mc mb --ignore-existing collab/collab
        mc anonymous set download collab/collab
        echo "MinIO 初始化完成：bucket=collab（公共读）"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  minio-data:
