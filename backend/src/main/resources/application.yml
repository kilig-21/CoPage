server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: collab-docs
  datasource:
    # allowPublicKeyRetrieval=true 是 MySQL 8 用 caching_sha2_password 时的必需参数，
    # 否则非 SSL 连接会报 "Public Key Retrieval is not allowed"。
    url: ${MYSQL_URL:jdbc:mysql://localhost:3308/collab_doc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:collab}
    password: ${RABBITMQ_PASSWORD:123456}
    listener:
      simple:
        acknowledge-mode: manual
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

collab:
  jwt:
    # 仅本地开发默认值；部署时必须通过环境变量覆盖，并至少 32 字节。
    secret: ${JWT_SECRET:change-this-local-development-secret-key-please}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:collab}

logging:
  level:
    com.school.collab: info
